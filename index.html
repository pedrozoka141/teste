<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Exploração - Folha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h2>WASD para mover | 'E' para ler | 'ESC' para fechar</h2>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <p id="status">Encontre a folha de papel.</p>
    </div>

    <div id="noteModal" class="hidden">
        <div class="modal-content">
            <h3>Antigo Diário</h3>
            <p>04 de Abril, 2026...</p>
            <p>As paredes parecem se mover quando não estou olhando. 
               Preciso encontrar a saída antes que as luzes se apaguem.</p>
            <hr>
            <small>Aperte ESC para fechar</small>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
